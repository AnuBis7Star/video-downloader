[project]
name = "video-downloader"
version = "1.1.0"
description = "A small Mac app for saving YouTube videos and playlists, built on yt-dlp."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "imageio-ffmpeg>=0.8.1",
    "pywebview>=6.2.1",
    "yt-dlp[default]>=2026.10.26",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
